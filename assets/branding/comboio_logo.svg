<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#FFB74D"/>
      <stop offset="0.55" stop-color="#FB8C00"/>
      <stop offset="1" stop-color="#E65100"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFF8E1" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#FFF8E1" stop-opacity="0"/>
    </linearGradient>
    <!-- Moto com piloto, de lado, para a direita: 160 x 100 -->
    <symbol id="moto" viewBox="0 0 160 100" overflow="visible">
      <g fill="#21130D">
        <circle cx="34" cy="74" r="23"/>
        <circle cx="130" cy="74" r="23"/>
        <path d="M34 74 L50 50 L26 45 L28 38 L58 37 L66 28 L98 25 L114 30 L124 30
                 L134 74 L124 74 L112 46 L104 58 L98 70 L60 70 L52 56 Z"/>
        <circle cx="80" cy="7" r="13"/>
        <path d="M74 18 L58 37 L84 37 L96 22 Z"/>
        <path d="M86 20 L112 27" stroke="#21130D" stroke-width="9" stroke-linecap="round"/>
      </g>
      <circle cx="34" cy="74" r="10" fill="#FB8C00"/>
      <circle cx="130" cy="74" r="10" fill="#FB8C00"/>
      <circle cx="34" cy="74" r="4" fill="#21130D"/>
      <circle cx="130" cy="74" r="4" fill="#21130D"/>
      <path d="M84 3 Q94 6 93 12 L84 12 Z" fill="#FFE0B2"/>
    </symbol>
    <!-- Carro (SUV), de lado, para a direita: 200 x 100 -->
    <symbol id="carro" viewBox="0 0 200 100" overflow="visible">
      <g fill="#21130D">
        <!-- carroceria e cabine -->
        <path d="M6 72 L6 50 Q8 42 18 40 L52 36 L76 12 Q80 8 88 8 L140 8 Q148 8 152 13
                 L172 38 L188 42 Q196 44 196 54 L196 72 Z"/>
        <circle cx="46" cy="74" r="22"/>
        <circle cx="156" cy="74" r="22"/>
      </g>
      <!-- vidros -->
      <path d="M62 36 L82 16 L110 16 L110 36 Z" fill="#FFCC80"/>
      <path d="M118 16 L142 16 L160 36 L118 36 Z" fill="#FFCC80"/>
      <!-- rodas -->
      <circle cx="46" cy="74" r="10" fill="#FB8C00"/>
      <circle cx="156" cy="74" r="10" fill="#FB8C00"/>
      <circle cx="46" cy="74" r="4" fill="#21130D"/>
      <circle cx="156" cy="74" r="4" fill="#21130D"/>
    </symbol>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- estrada -->
  <path d="M-20 420 C 150 372, 330 392, 540 344" fill="none" stroke="#21130D" stroke-width="64" stroke-linecap="round" opacity="0.9"/>
  <path d="M-20 420 C 150 372, 330 392, 540 344" fill="none" stroke="#FFE0B2" stroke-width="6" stroke-dasharray="24 22"/>

  <!-- comboio: moto pequena atrás e carro no meio, mais claros -->
  <use xlink:href="#moto" x="14" y="306" width="104" height="65" opacity="0.45"/>
  <use xlink:href="#carro" x="92" y="270" width="170" height="85" opacity="0.72"/>

  <!-- moto da frente, com o farol iluminando a estrada -->
  <path d="M436 236 L520 196 L520 290 Z" fill="url(#beam)" opacity="0.85"/>
  <use xlink:href="#moto" x="222" y="190" width="256" height="160"/>
  <circle cx="434" cy="240" r="7" fill="#FFF59D"/>
</svg>
