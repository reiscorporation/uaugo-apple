<!doctype html>
<!--
  sim3d/index.html — Visão 3D da navegação (UauGo v2, só no Galaxy de teste)

  O que faz: Desenha em 3D, em primeira pessoa, a estrada da rota com o
    "tapete" azul na faixa certa, setas flutuando antes de cada conversão e
    o destino com um feixe de luz. Só ruas (sem prédios): leve e prático.
    Saídas e bifurcações ganham pista que se divide, placas verdes no alto
    (500 m e 200 m), marcos de 300/200/100 m, zebrado na divisão e troca de
    faixa antes da saída pela esquerda; a câmera sobe um pouco perto delas.
    Alertas viram objetos na pista: lombada (com faixas amarelas), radar
    fixo/móvel (poste, placa do limite e "RADAR" pintado no chão), polícia
    (viatura com giroflex), posto policial, pedágio, semáforo e os alertas
    dos usuários (placa de perigo com o símbolo).
    A posição vem do app (GPS projetado na rota); entre uma leitura e
    outra, o carro anda sozinho na velocidade atual (fica suave).
  Quem usa: lib/widgets/sim3d_view.dart (WebView). O app chama:
    sim3d.setRoute({pts:[[lat,lng]..], steps:[{la,lo,m,t}], dest})
    sim3d.update({along, v, off})   along = metros desde o início da rota
    sim3d.setAlerts([{la, lo, k, lim?, dir?, e?, n?}])
      k: radar | radarAvg | radarRed | mradar | bump | post | toll |
         tollMoto | signal | police | (outros alertas do app: e = emoji, n = nome)
    sim3d.setDark(true|false), sim3d.setActive(true|false)
  e recebe pelo canal "Sim3D": "ready", "map" (pinça para afastar = volta
    ao mapa de cima).
  Funciona sem internet: three.min.js vai junto no app.
-->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<style>
  :root { --sky-top: #5f9fd6; --sky-low: #dbe7ee; }
  body.dark { --sky-top: #05080f; --sky-low: #16223a; }
  html, body { margin: 0; height: 100%; overflow: hidden; touch-action: none; }
  body { background: linear-gradient(180deg, var(--sky-top) 0%, var(--sky-low) 58%, var(--sky-low) 100%); }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<script src="three.min.js"></script>
<script>
'use strict';
const send = m => { try { Sim3D.postMessage(m); } catch (_) {} };
// erros e um resumo a cada 10 s vão para o log do app (adb logcat, "Sim3D")
addEventListener('error', e => send('log:erro ' + e.message + ' @' + e.lineno));

/* ---------- utilidades ---------- */
const len = (ax, ay, bx, by) => Math.hypot(bx - ax, by - ay);
const clamp01 = x => Math.max(0, Math.min(1, x));
let LAT0 = 0, LON0 = 0, KX = 1, KY = 110540;
const proj = (lat, lon) => [(lon - LON0) * KX, (lat - LAT0) * KY]; // x leste, y norte (m)

function roundCorners(p) {
  const out = [p[0]];
  for (let i = 1; i < p.length - 1; i++) {
    const a = p[i - 1], b = p[i], c = p[i + 1];
    const l1 = len(a[0], a[1], b[0], b[1]), l2 = len(b[0], b[1], c[0], c[1]);
    if (l1 < 0.5 || l2 < 0.5) { out.push(b); continue; }
    const v1 = [(b[0] - a[0]) / l1, (b[1] - a[1]) / l1], v2 = [(c[0] - b[0]) / l2, (c[1] - b[1]) / l2];
    if (v1[0] * v2[0] + v1[1] * v2[1] > 0.995) { out.push(b); continue; }
    const t = Math.min(11, l1 * 0.45, l2 * 0.45);
    const p1 = [b[0] - v1[0] * t, b[1] - v1[1] * t], p2 = [b[0] + v2[0] * t, b[1] + v2[1] * t];
    for (let k = 0; k <= 8; k++) {
      const u = k / 8, w0 = (1 - u) * (1 - u), w1 = 2 * u * (1 - u), w2 = u * u;
      out.push([w0 * p1[0] + w1 * b[0] + w2 * p2[0], w0 * p1[1] + w1 * b[1] + w2 * p2[1]]);
    }
  }
  out.push(p[p.length - 1]);
  return out;
}
function resample(p, step) {
  const out = [p[0].slice()];
  let carry = 0;
  for (let i = 1; i < p.length; i++) {
    const a = p[i - 1], b = p[i], l = len(a[0], a[1], b[0], b[1]);
    if (l === 0) continue;
    let d = step - carry;
    while (d <= l) { const u = d / l; out.push([a[0] + (b[0] - a[0]) * u, a[1] + (b[1] - a[1]) * u]); d += step; }
    carry = l - (d - step);
  }
  out.push(p[p.length - 1].slice());
  return out;
}

/* ---------- rota ---------- */
const STEP = 2;      // amostra a cada 2 m (rotas longas cabem na memória)
const LANE = 1.75;   // mão direita: o carro anda 1,75 m à direita do eixo
let C = [], P = [], CUM = [0], TOTAL = 0;
let RAW_CUM = [], RAW_S = []; // distância no traçado original -> no caminho suavizado
let MAN = [], DEST = '';
const GC = 40; let GRID = new Map(); // grade de 40 m do caminho (achar alertas na rota)

function idxAt(s) {
  let lo = 0, hi = CUM.length - 1;
  while (hi - lo > 1) { const m = (lo + hi) >> 1; if (CUM[m] <= s) lo = m; else hi = m; }
  return lo;
}
function at(arr, s) {
  s = Math.max(0, Math.min(TOTAL, s));
  const i = Math.min(idxAt(s), arr.length - 2), a = arr[i], b = arr[i + 1];
  const seg = CUM[i + 1] - CUM[i] || 1, u = (s - CUM[i]) / seg;
  const j = Math.min(arr.length - 1, i + 3), k = Math.max(0, i - 2);
  const hl = len(arr[k][0], arr[k][1], arr[j][0], arr[j][1]) || 1;
  return { x: a[0] + (b[0] - a[0]) * u, y: a[1] + (b[1] - a[1]) * u, dx: (arr[j][0] - arr[k][0]) / hl, dy: (arr[j][1] - arr[k][1]) / hl };
}
const posAt = s => at(P, s), centerAt = s => at(C, s);
const yawOf = p => Math.atan2(-p.dx, p.dy); // objeto com a frente (-Z) no sentido da rota

// metros do app (no traçado original) -> metros no caminho suavizado
function sFromAlong(a) {
  if (RAW_CUM.length < 2) return a;
  let lo = 0, hi = RAW_CUM.length - 1;
  if (a <= 0) return 0;
  if (a >= RAW_CUM[hi]) return TOTAL;
  while (hi - lo > 1) { const m = (lo + hi) >> 1; if (RAW_CUM[m] <= a) lo = m; else hi = m; }
  const u = (a - RAW_CUM[lo]) / ((RAW_CUM[hi] - RAW_CUM[lo]) || 1);
  return RAW_S[lo] + (RAW_S[hi] - RAW_S[lo]) * u;
}

// saída / bifurcação / "mantenha-se" (Google: ramp-right, fork-left, keep-right)
const isExit = m => /ramp|fork|keep/.test(m);

function setRouteData(d) {
  const pts = d.pts || [];
  if (pts.length < 2) return false;
  LAT0 = pts[0][0]; LON0 = pts[0][1]; KX = 111320 * Math.cos(LAT0 * Math.PI / 180);
  const raw = [];
  for (const q of pts) {
    const p = proj(q[0], q[1]);
    if (!raw.length || len(raw[raw.length - 1][0], raw[raw.length - 1][1], p[0], p[1]) > 0.3) raw.push(p);
  }
  if (raw.length < 2) return false;
  C = resample(roundCorners(raw), STEP);
  const CC = [0]; // distância ao longo do eixo (antes da troca de faixa)
  for (let i = 1; i < C.length; i++) CC.push(CC[i - 1] + len(C[i - 1][0], C[i - 1][1], C[i][0], C[i][1]));
  const nearC = (x, y, from, maxN, maxD, give) => {
    let best = -1, bd = maxD;
    for (let i = from; i < Math.min(C.length, from + maxN); i++) {
      const dd = len(x, y, C[i][0], C[i][1]);
      if (dd < bd) { bd = dd; best = i; }
      if (best >= 0 && dd > bd + give) break;
    }
    return best;
  };
  // manobras do app (Google: turn-left, ramp-right, roundabout-left...)
  const man = [];
  let iFrom = 0;
  for (const st of d.steps || []) {
    const p = proj(st.la, st.lo);
    const best = nearC(p[0], p[1], iFrom, 20000, 60, 200);
    if (best < 0) continue;
    const m = st.m || '', side = /left/.test(m) ? -1 : /right/.test(m) ? 1 : 0;
    const t = st.t || '';
    man.push({ i: best, side, m, t, street: streetOf(t), exit: isExit(m) && side !== 0,
      toward: towardOf(t), num: (t.match(/sa[ií]da\s+(\d+[A-Za-z]?)/i) || [])[1] || '' });
    iFrom = best;
  }
  // faixa: direita; antes de saída pela esquerda o carro passa para a esquerda
  const leftExits = man.filter(m => m.exit && m.side < 0).map(m => CC[m.i]);
  const laneAt = sc => {
    let off = LANE;
    for (const e of leftExits) {
      const a = e - 450, b = e + 60;
      if (sc < a - 80 || sc > b + 80) continue;
      const w = sc < a ? (sc - (a - 80)) / 80 : sc > b ? 1 - (sc - b) / 80 : 1;
      off = Math.min(off, LANE - 2 * LANE * clamp01(w));
    }
    return off;
  };
  P = C.map((p, i) => {
    const a = C[Math.max(0, i - 2)], b = C[Math.min(C.length - 1, i + 2)];
    const l = len(a[0], a[1], b[0], b[1]) || 1, dx = (b[0] - a[0]) / l, dy = (b[1] - a[1]) / l;
    const off = laneAt(CC[i]);
    return [p[0] + dy * off, p[1] - dx * off];
  });
  CUM = [0];
  for (let i = 1; i < P.length; i++) CUM.push(CUM[i - 1] + len(P[i - 1][0], P[i - 1][1], P[i][0], P[i][1]));
  TOTAL = CUM[CUM.length - 1];
  MAN = man.map(m => ({ ...m, s: CUM[m.i] }));
  // cada vértice original -> s (busca sempre para frente: rotas com retorno)
  RAW_CUM = [0]; RAW_S = [];
  for (let k = 1; k < raw.length; k++) RAW_CUM.push(RAW_CUM[k - 1] + len(raw[k - 1][0], raw[k - 1][1], raw[k][0], raw[k][1]));
  // o app mede em lat/lng de verdade; corrige a pequena diferença de escala
  const appLen = (() => {
    let acc = 0;
    for (let k = 1; k < pts.length; k++) {
      const la = (pts[k][0] + pts[k - 1][0]) / 2 * Math.PI / 180;
      acc += Math.hypot((pts[k][1] - pts[k - 1][1]) * 111320 * Math.cos(la), (pts[k][0] - pts[k - 1][0]) * 110540);
    }
    return acc;
  })();
  const k0 = appLen > 0 ? RAW_CUM[RAW_CUM.length - 1] / appLen : 1;
  RAW_CUM = RAW_CUM.map(v => v / k0);
  let from = 0;
  for (let k = 0; k < raw.length; k++) {
    const best = Math.max(from, nearC(raw[k][0], raw[k][1], from, 4000, 1e12, 60));
    RAW_S.push(CUM[best]); from = best;
  }
  GRID = new Map();
  for (let i = 0; i < C.length; i++) {
    const key = Math.floor(C[i][0] / GC) + ',' + Math.floor(C[i][1] / GC);
    let a = GRID.get(key); if (!a) GRID.set(key, a = []); a.push(i);
  }
  DEST = d.dest || '';
  return true;
}
// "... em direção a Cravinhos/Campinas/São Paulo." -> "Cravinhos · Campinas · São Paulo"
function towardOf(t) {
  const m = t.match(/(?:dire[çc][ãa]o (?:a|à|ao)|toward)\s+(.+?)\.?$/i);
  return m ? m[1].split('/').map(x => x.trim()).filter(Boolean).slice(0, 3).join(' · ') : '';
}
function streetOf(t) {
  t = t.replace(/(?:em|na) dire[çc][ãa]o (?:a|à|ao)\s+/i, 'para ');
  const m = t.match(/\b(?:na|no|para a|para o|para|em|pela|pelo|on|onto|toward|at)\s+(.+?)(?:\s*(?:\/|,|\(|Passe por|O destino).*)?$/i);
  const s = (m ? m[1] : '').trim().replace(/[.;:]+$/, '');
  return s.length > 30 ? s.slice(0, 29) + '…' : s;
}

/* ---------- cena ---------- */
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: 'low-power' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5));
renderer.setClearColor(0x000000, 0);
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(70, 1, 0.4, 900);
const hemi = new THREE.HemisphereLight(0xdfeeff, 0x8a8f86, 0.85); scene.add(hemi);
const sunL = new THREE.DirectionalLight(0xfff1dc, 0.65); sunL.position.set(-180, 260, 120); scene.add(sunL);
scene.fog = new THREE.Fog(0xdbe7ee, 70, 430);

const PAL = {
  day:   { fog: 0xdbe7ee, ground: 0xa9b1a4, walk: '#b9bdb8', road: '#40464f', white: '#f2f2ec', yellow: '#f2c230', hemi: 0.85, sun: 0.65 },
  night: { fog: 0x16223a, ground: 0x1d2433, walk: '#3a4250', road: '#262b33', white: '#d9dee6', yellow: '#d7a92a', hemi: 0.55, sun: 0.25 },
};
let pal = PAL.day;
const LV = { ground: 0, walk: 0.08, road: 0.12, mark: 0.15, paint: 0.17, carpet: 0.2 };
const toV = (x, h, y) => new THREE.Vector3(x, h, -y);
const col = h => new THREE.Color(h);

const ground = new THREE.Mesh(new THREE.PlaneGeometry(2400, 2400).rotateX(-Math.PI / 2), new THREE.MeshLambertMaterial({ color: pal.ground }));
scene.add(ground);

// Rua em pedaços de 600 m perto do carro (rotas longas não pesam):
// cada pedaço é desenhado em volta da sua própria origem (precisão do celular).
const CHUNK = 600;
const chunks = new Map();
function flatMat(off) {
  return new THREE.MeshLambertMaterial({ vertexColors: true, side: THREE.DoubleSide, polygonOffset: true, polygonOffsetFactor: -off, polygonOffsetUnits: -off, fog: true });
}
const MATS = { walk: flatMat(2), road: flatMat(3), mark: flatMat(4) };
function Flat(ox, oy) { this.p = []; this.c = []; this.ox = ox; this.oy = oy; }
Flat.prototype.tri = function (a, b, c, k) {
  for (const v of [a, b, c]) { this.p.push(v[0] - this.ox, v[2], -(v[1] - this.oy)); this.c.push(k.r, k.g, k.b); }
};
Flat.prototype.strip = function (pts, hw, h, k, off) {
  off = off || 0;
  if (pts.length < 2) return;
  const L = [], R = [];
  for (let i = 0; i < pts.length; i++) {
    const a = pts[Math.max(0, i - 1)], b = pts[Math.min(pts.length - 1, i + 1)];
    let dx = b[0] - a[0], dy = b[1] - a[1]; const l = Math.hypot(dx, dy) || 1; dx /= l; dy /= l;
    const cx = pts[i][0] + dy * off, cy = pts[i][1] - dx * off;
    L.push([cx - dy * hw, cy + dx * hw, h]); R.push([cx + dy * hw, cy - dx * hw, h]);
  }
  for (let i = 0; i < pts.length - 1; i++) { this.tri(L[i], R[i], L[i + 1], k); this.tri(R[i], R[i + 1], L[i + 1], k); }
};
Flat.prototype.mesh = function (mat) {
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(this.p, 3));
  g.setAttribute('color', new THREE.Float32BufferAttribute(this.c, 3));
  g.computeVertexNormals();
  const m = new THREE.Mesh(g, mat); m.position.set(this.ox, 0, -this.oy);
  return m;
};
const ROAD_HW = 3.7; // rua de 2 faixas (o Google não diz a largura; o motor próprio dirá)
const inExitZone = s => MAN.some(m => m.exit && s > m.s - 520 && s < m.s + 20);
function buildChunk(n) {
  const s0 = n * CHUNK, s1 = Math.min(TOTAL, s0 + CHUNK + STEP);
  if (s0 >= TOTAL) return null;
  const i0 = idxAt(s0), i1 = Math.min(C.length - 1, idxAt(s1) + 1);
  const pts = C.slice(i0, i1 + 1);
  if (pts.length < 2) return null;
  const o = pts[0], walk = new Flat(o[0], o[1]), road = new Flat(o[0], o[1]), mark = new Flat(o[0], o[1]);
  const kWalk = col(pal.walk), kRoad = col(pal.road), kWhite = col(pal.white), kYellow = col(pal.yellow);
  walk.strip(pts, ROAD_HW + 2.4, LV.walk, kWalk);
  road.strip(pts, ROAD_HW, LV.road, kRoad);
  // bordas brancas contínuas e eixo tracejado (3 m pintado, 5 m não):
  // amarelo na mão dupla; branco perto de saídas (mesma mão)
  mark.strip(pts, 0.1, LV.mark, kWhite, ROAD_HW - 0.35);
  mark.strip(pts, 0.1, LV.mark, kWhite, -(ROAD_HW - 0.35));
  const dashEvery = Math.round(8 / STEP), dashLen = Math.max(1, Math.round(3 / STEP));
  for (let i = 0; i + dashLen < pts.length; i += dashEvery) {
    const s = CUM[i0 + i];
    if (MAN.some(m => !m.exit && Math.abs(m.s - s) < 16)) continue; // nada pintado no cruzamento
    mark.strip(pts.slice(i, i + dashLen + 1), 0.08, LV.mark, inExitZone(s) ? kWhite : kYellow);
  }
  for (const m of MAN) {
    if (m.exit) { exitRoad(m, s0, s1, walk, road, mark, kWalk, kRoad, kWhite); continue; }
    // cruzamentos: a rua continua reto depois da conversão e do outro lado
    if (!m.side || m.s < s0 || m.s >= s0 + CHUNK) continue;
    const before = centerAt(m.s - 16), corner = centerAt(m.s), after = centerAt(m.s + 16);
    const stub = (x, y, dx, dy, L) => {
      const q = []; for (let d = -6; d <= L; d += 2) q.push([x + dx * d, y + dy * d]);
      walk.strip(q, ROAD_HW + 2.4, LV.walk - 0.01, kWalk);
      road.strip(q, ROAD_HW, LV.road - 0.01, kRoad);
    };
    stub(corner.x, corner.y, before.dx, before.dy, 40);       // segue reto
    stub(corner.x, corner.y, -after.dx, -after.dy, 30);       // a rua transversal do outro lado
  }
  const g = new THREE.Group();
  g.add(walk.mesh(MATS.walk), road.mesh(MATS.road), mark.mesh(MATS.mark));
  scene.add(g);
  return g;
}
// Saída: antes dela a pista ganha uma faixa a mais do lado de quem segue;
// na divisão a pista principal continua reto e o zebrado separa as duas.
function exitRoad(m, s0, s1, walk, road, mark, kWalk, kRoad, kWhite) {
  const far = -m.side; // lado de quem segue na principal
  const a = Math.max(s0, m.s - 520), b = Math.min(s1, m.s);
  if (a < b) {
    const seg = C.slice(idxAt(a), Math.min(C.length - 1, idxAt(b) + 1) + 1);
    walk.strip(seg, 2.6, LV.walk, kWalk, far * (ROAD_HW + 3.6));
    road.strip(seg, 1.85, LV.road, kRoad, far * (ROAD_HW + 1.75));
    mark.strip(seg, 0.1, LV.mark, kWhite, far * (ROAD_HW + 3.25));
  }
  if (m.s < s0 || m.s >= s0 + CHUNK) return;
  const before = centerAt(m.s - 40), corner = centerAt(m.s);
  const nx = before.dy * far, ny = -before.dx * far; // normal para o lado da principal
  const q = [];
  for (let d = -10; d <= 300; d += 3) q.push([corner.x + before.dx * d + nx * (ROAD_HW + 1.75), corner.y + before.dy * d + ny * (ROAD_HW + 1.75)]);
  walk.strip(q, ROAD_HW + 4.2, LV.walk - 0.01, kWalk);
  road.strip(q, ROAD_HW + 1.85, LV.road - 0.01, kRoad);
  for (let i = 4; i + 1 < q.length; i += 3) mark.strip(q.slice(i, i + 2), 0.08, LV.mark, kWhite);
  // zebrado entre os dois ramos
  for (let d = 6; d <= 46; d += 5) {
    const r = centerAt(m.s + d), mx = corner.x + before.dx * d + nx * (ROAD_HW + 1.75), my = corner.y + before.dy * d + ny * (ROAD_HW + 1.75);
    const ex = r.x + nx * ROAD_HW, ey = r.y + ny * ROAD_HW;               // borda do ramo da rota
    const fx = mx - nx * (ROAD_HW + 1.85), fy = my - ny * (ROAD_HW + 1.85); // borda da principal
    if ((fx - ex) * nx + (fy - ey) * ny < 0.8) continue;
    mark.strip([[ex, ey], [fx + before.dx * 2.5, fy + before.dy * 2.5]], 0.22, LV.mark + 0.005, kWhite);
  }
}
function disposeChunk(g) {
  scene.remove(g);
  g.children.forEach(m => m.geometry.dispose());
}
function clearChunks() { for (const g of chunks.values()) if (g) disposeChunk(g); chunks.clear(); }
function updateChunks(s) {
  const n = Math.floor(s / CHUNK), need = new Set([n - 1, n, n + 1]);
  for (const [k, g] of chunks) if (!need.has(k)) { if (g) disposeChunk(g); chunks.delete(k); }
  for (const k of need) if (k >= 0 && !chunks.has(k)) chunks.set(k, buildChunk(k));
}

/* ---------- tapete azul ---------- */
const CARPET_N = 120, CARPET_L = 170;
const carpetGeo = new THREE.BufferGeometry();
{
  const uv = new Float32Array((CARPET_N + 1) * 4), idx = [];
  for (let i = 0; i <= CARPET_N; i++) { uv.set([0, 0, 1, 0], i * 4); if (i < CARPET_N) { const a = i * 2; idx.push(a, a + 1, a + 2, a + 1, a + 3, a + 2); } }
  carpetGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array((CARPET_N + 1) * 6), 3));
  carpetGeo.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
  carpetGeo.setAttribute('dist', new THREE.BufferAttribute(new Float32Array((CARPET_N + 1) * 2), 1));
  carpetGeo.setIndex(idx);
}
const carpetMat = new THREE.ShaderMaterial({

   traçado planejado. O carro anda pela posição real, a rua percorrida aparece

  update(d) {

    v = Math.max(0, d.v || 0); offRoute = !!d.off;

    camera.lookAt(look);
    updateCarpet(s + 1.5);
    carpetMat.uniforms.time.value = time;
    carpetMat.uniforms.dim.value += (0.35 - carpetMat.uniforms.dim.value) * Math.min(1, dt * 3);
    updateMarkers(s, time);
    updateAlerts(s, time);
  } else if (hasRoute) {
    if (trailGroup) clearTrail();
    // anda na velocidade atual e encosta aos poucos na posição do GPS
    s += v * dt;
    s += (target + v * 0.5 - s) * Math.min(1, dt * 1.5);
    s = Math.max(0, Math.min(TOTAL, s));
    updateChunks(s);
    // perto de saída/bifurcação a câmera sobe um pouco e olha mais longe
    const ex = MAN.find(m => m.exit && m.s - s < 350 && m.s - s > -40);
    lift += ((ex ? 1 : 0) - lift) * Math.min(1, dt * 1.2);
    const p = posAt(s), f = posAt(s + 22 + 20 * lift);
    ground.position.set(p.x, LV.ground, -p.y);
    camera.position.copy(toV(p.x, 1.35 + 2.2 * lift, p.y));
    const want = toV(f.x, 0.85, f.y);
    // ponto de olhar suave; se ficou para trás (salto, tela parada), vai direto
    const behind = (look.x - camera.position.x) * (want.x - camera.position.x) + (look.z - camera.position.z) * (want.z - camera.position.z) < 0;
    if (!lookInit || behind) { look.copy(want); lookInit = true; } else look.lerp(want, 1 - Math.exp(-dt * 5));
    camera.lookAt(look);
    updateCarpet(s + 1.5);
    carpetMat.uniforms.time.value = time;
    carpetMat.uniforms.dim.value += ((offRoute ? 0.25 : 1) - carpetMat.uniforms.dim.value) * Math.min(1, dt * 3);
    updateMarkers(s, time);
    updateAlerts(s, time);
  }
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
send('ready');
setInterval(() => {
  if (!active) return;
  const kinds = {}; for (const a of ALERT_RAW) kinds[a.k] = (kinds[a.k] || 0) + 1;
  send('log:' + JSON.stringify({ s: Math.round(s), total: Math.round(TOTAL), v, man: MAN.length,
    saidas: MAN.filter(m => m.exit).length, tipos: [...new Set(MAN.map(m => m.m))].join(','),
    recebidos: kinds, naRota: ALERTS.length, visiveis: ALERTS.filter(a => a.obj).length }));
}, 10000);
</script>
