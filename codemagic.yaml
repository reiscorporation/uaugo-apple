# Codemagic (equipe "UauGo"): compila o UauGo para iPhone e envia ao TestFlight.
#
# Já feito (24/11): chave da App Store Connect "UauGo ASC" na equipe,
# certificado "uaugo_distribution" (Apple Distribution) guardado no Codemagic,
# app uaugo-apple transferido para a equipe.
#
# Ordem:
#   1. ios-preparar (uma vez): cria o identificador helpaitech.comboio, liga
#      Sign in with Apple + Push e cria o perfil "UauGo App Store".
#   2. Codemagic > Settings > Code signing identities > iOS provisioning
#      profiles > Fetch profiles: trazer o "UauGo App Store".
#   3. ios-testflight: compila e manda para o TestFlight.
#
# Como a versão da Play: sem dart-defines (rotas do Google).
workflows:
  ios-preparar:
    name: UauGo iOS - preparar (1 vez)
    instance_type: mac_mini_m2
    max_build_duration: 15
    integrations:
      app_store_connect: UauGo ASC
    triggering:
      events: []
    scripts:
      - name: Identificador, capacidades e perfil
        script: |
          set -x
          ID=$(app-store-connect bundle-ids list \
                 --bundle-id-identifier "helpaitech.comboio" \
                 --strict-match-identifier --platform IOS --json \
               | python3 -c 'import sys,json; d=json.load(sys.stdin); print(d[0]["id"] if d else "")')
          if [ -z "$ID" ]; then
            ID=$(app-store-connect bundle-ids create "helpaitech.comboio" \
                   --name "UauGo" --platform IOS --json \
                 | python3 -c 'import sys,json; print(json.load(sys.stdin)["id"])')
          fi
          echo "Bundle ID resource: $ID"
          app-store-connect bundle-ids enable-capabilities "$ID" \
            --capability "Push Notifications" "Sign In with Apple"
          # Perfil antigo (sem as capacidades) sai; o novo já as inclui.
          for P in $(app-store-connect profiles list --json \
                     | python3 -c 'import sys,json; print(" ".join(p["id"] for p in json.load(sys.stdin) if p["attributes"]["name"]=="UauGo App Store"))'); do
            app-store-connect profiles delete "$P"
          done
          CERT=$(app-store-connect certificates list --type DISTRIBUTION --json \
                 | python3 -c 'import sys,json; d=json.load(sys.stdin); print(d[0]["id"] if d else "")')
          echo "Certificado: $CERT"
          app-store-connect profiles list --json | python3 -c '
          import sys,json
          for p in json.load(sys.stdin):
              a=p["attributes"]; print(a["name"], a["profileType"], a["profileState"])'
          app-store-connect profiles create "$ID" \
            --certificate-ids "$CERT" --type IOS_APP_STORE \
            --name "UauGo App Store" \
            || app-store-connect profiles create --help

  ios-testflight:
    name: UauGo iOS -> TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 90
    integrations:
      app_store_connect: UauGo ASC
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: helpaitech.comboio
    triggering:
      events: []   # só quando disparar manualmente no Codemagic
    scripts:
      - name: Assinatura
        script: xcode-project use-profiles
      - name: Dependências
        script: |
          flutter pub get
          cd ios && pod install --repo-update
      - name: Compilar IPA
        script: |
          # BUILD_NUMBER = contador de compilações do Codemagic (sempre sobe)
          flutter build ipa --release \
            --build-number=$BUILD_NUMBER \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
