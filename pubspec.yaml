name: comboio
description: App para expedições de moto em comboio.
publish_to: 'none'
version: 1.0.16+17

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_messaging: ^15.1.3
  google_maps_flutter: ^2.9.0
  geolocator: ^13.0.1
  http: ^1.2.2
  shared_preferences: ^2.3.2
  url_launcher: ^6.3.1
  firebase_storage: ^12.3.2
  image_picker: ^1.1.2
  cloud_functions: ^5.1.3
  geocoding: ^4.0.0
  firebase_app_check: ^0.3.1
  share_plus: ^13.3.1
  flutter_tts: ^4.2.5
  path_provider: ^2.1.6
  wakelock_plus: ^1.8.1
  gal: ^2.3.3
  battery_plus: ^7.1.2
  package_info_plus: ^10.2.2
  qr_flutter: ^4.1.0
  firebase_analytics: ^11.6.0
  firebase_crashlytics: ^4.3.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

# battery_plus (Linux) pede dbus 0.7 e wakelock_plus pede 0.8. O dbus só é
# usado no Linux de desktop, que este app não gera: forçamos a 0.8.
dependency_overrides:
  dbus: ^0.8.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/
    - assets/legal/

# Ícone do app (gerar com: dart run flutter_launcher_icons)
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/branding/comboio_icon_square.png"
  adaptive_icon_background: "#0F1B2D"
  adaptive_icon_foreground: "assets/branding/comboio_icon_fg.png"
  remove_alpha_ios: true
