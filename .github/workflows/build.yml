# Compila e testa o Comboio na nuvem a cada envio de código.
# - Android: gera um APK de depuração para baixar (aba Actions > execução > Artifacts)
# - iOS: compila num Mac virtual (sem assinatura) para achar erros
# - Testes do app e das regras de segurança do Firebase
name: Build e testes

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  testes-app:
    name: Testes do app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Configurar projeto
        shell: pwsh
        run: ./scripts/configurar.ps1 -CI
      - name: Análise estática
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Testes
        run: flutter test

  testes-regras:
    name: Testes das regras de segurança
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install -g firebase-tools
      - run: npm install
        working-directory: tests/rules
      - name: Emulador + testes
        run: firebase emulators:exec --only firestore --project demo-comboio "npm --prefix tests/rules test"

  android:
    name: Build Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Configurar projeto
        shell: pwsh
        env:
          ANDROID_MAPS_KEY: ${{ secrets.ANDROID_MAPS_KEY }}
        run: |
          if ($env:ANDROID_MAPS_KEY) { "ANDROID_MAPS_KEY=$env:ANDROID_MAPS_KEY" | Add-Content config.env }
          ./scripts/configurar.ps1 -CI
      - name: Build APK (debug)
        run: flutter build apk --debug --dart-define-from-file=config/dart_defines.json
      - uses: actions/upload-artifact@v4
        with:
          name: comboio-android-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14

  ios:
    name: Build iOS (sem assinatura)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Configurar projeto
        shell: pwsh
        run: ./scripts/configurar.ps1 -CI
      - name: Build iOS
        run: flutter build ios --no-codesign --dart-define-from-file=config/dart_defines.json
